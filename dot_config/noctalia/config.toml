# Noctalia v5 config — ported from v4 settings.json (2026-07-19)
# v4 files (settings.json, colors.json, colorschemes/) kept for rollback.

[theme]
mode             = "dark"
source           = "wallpaper"       # v4: useWallpaperColors = true
wallpaper_scheme = "m3-tonal-spot"   # v4: generationMethod = "tonal-spot"

[shell]
avatar_path       = "~/.face"
telemetry_enabled = false
# clipboard_enabled = false          # v4 had history off; you re-enabled via GUI (settings.toml wins) — key retired

# [shell.panel]
# transparency_mode = "glass"          # v4: panelBackgroundOpacity 0.39

# Screenshot → save PNG → open in Gradia to annotate → path on clipboard
# (save_to_file matches your GUI override; GUI also set confirm_region = true)
[shell.screenshot]
save_to_file     = true
directory        = "~/screenshots"
filename_pattern = "%Y%m%d-%H%M%S"
pipe_to_command  = true
# After Gradia closes, copy the newest PNG in ~/screenshots — the annotated export
# if you saved one (Ctrl+S into ~/screenshots), else the original capture.
pipe_command     = 'flatpak run be.alexandervanhee.gradia "$NOCTALIA_SCREENSHOT_PATH"; f=$(command ls -t "$HOME/screenshots"/*.png 2>/dev/null | head -1); [ -n "$f" ] && printf %s "$f" | wl-copy && notify-send -t 3000 "Path copied" "$f"'
# satty fallback:
# pipe_command   = 'satty -f - -o "$NOCTALIA_SCREENSHOT_PATH" && printf %s "$NOCTALIA_SCREENSHOT_PATH" | wl-copy'

# Replaces v4 ssh-sessions plugin (no v5 port yet): type "/ssh" in launcher
[shell.launcher.dmenu.entry.ssh]
command = "awk '/^Host /{print $2}' ~/.ssh/config"
exec    = "ghostty -e ssh {selection}"
prefix  = "ssh"
glyph   = "server"

# ── Session panel: v4 order lock/suspend/hibernate/reboot/logout/shutdown/uefi,
#    all with 10 s countdown
[[shell.session.actions]]
action = "lock"
shortcut = "1"
countdown_seconds = 10

[[shell.session.actions]]
action = "suspend"
shortcut = "2"
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "Hibernate"
glyph = "moon"
command = "systemctl hibernate"
shortcut = "3"
countdown_seconds = 10

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 10

[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 10

[[shell.session.actions]]
action = "shutdown"
shortcut = "6"
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "UEFI Firmware"
glyph = "settings"
command = "systemctl reboot --firmware-setup"
shortcut = "7"
countdown_seconds = 10

