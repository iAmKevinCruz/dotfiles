# ── Night light: v4 enabled + forced, 6500/4000 K
[nightlight]
enabled           = true
force             = true
temperature_day   = 6500
temperature_night = 4000

# ── Wallpaper: v4 dir + crop + 1.5 s transitions (pixelate has no v5 equivalent)
[wallpaper]
enabled             = true
directory           = "/home/kevin/Pictures/Wallpapers"
fill_mode           = "crop"
transition          = ["fade", "disc", "stripes", "wipe", "honeycomb"]
transition_duration = 1500

