onboarding = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_scope = "all"
agent_panel_sort = "priority"

[experimental]
pane_history = true

[theme]
name = "catppuccin"

[keys]
# Prefix stays ctrl+b (matches your tmux default — you never rebound it).
# prefix = "ctrl+b"

# --- Requested ---
# Pane splits (tmux muscle memory). If the split axis feels swapped, swap these two.
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# Alt+arrows change pane focus (mirrors your tmux `bind -n M-Left/Right/Up/Down`).
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"

# Alt+z zoom pane (tmux `bind -n M-z resize-pane -Z`).
zoom = "alt+z"

# Alt+w session navigator / fuzzy jumper (tmux `bind -n M-w` sesh popup).
goto = "alt+w"

# --- Suggested from your tmux config ---
# Alt+n / Alt+p — next/prev tab (tmux M-n/M-p next/prev window).
next_tab = "alt+n"
previous_tab = "alt+p"

# Alt+Shift+n / Alt+Shift+p — next/prev workspace (tmux M-N/M-P switch session).
# Note: alt+shift chords can be flaky depending on terminal; swap to prefix+n/p if so.
next_workspace = "alt+shift+n"
previous_workspace = "alt+shift+p"

# Direct number switching (optional): alt+1..9 focuses agent rows.
# [keys.indexed]
# tabs = "ctrl"        # ctrl+1..9 switch tabs directly
# agents = "alt"       # alt+1..9 focus agent rows

# prefix+e (built-in edit_scrollback) dumps the pane and opens nvim at the
# bottom via the BufReadPost autocmd. prefix+shift+e instead opens nvim in a
# temp pane positioned at the line currently visible on screen — the closest
# herdr has to tmux's copy-cursor scrollback (herdr exposes no copy-mode cursor
# line, so it anchors on the last visible non-blank line).
[[keys.command]]
key = "prefix+shift+e"
type = "pane"
description = "Scrollback → nvim at current view"
command = "$HOME/.local/bin/herdr-scrollback-view"

# prefix+shift+r — rename the Claude session in the focused pane to match the
# tab title. Injects Claude's /rename slash command, so the name propagates to
# `claude --resume`, the terminal title, and claude.ai. Only fires when claude
# is idle (won't corrupt input mid-turn).
[[keys.command]]
key = "prefix+shift+r"
type = "pane"
description = "Rename claude session → tab title"
command = "$HOME/.local/bin/herdr-name-session-from-tab"

# prefix+shift+s — open the focused pane's Claude transcript in nvim. Replaces
# terminal scrollback for claude panes running the flicker-free ("tui":
# "fullscreen") renderer, whose alt-screen output never lands in scrollback.
# Full history, searchable, copyable.
[[keys.command]]
key = "prefix+shift+s"
type = "pane"
description = "Claude transcript → nvim"
command = "$HOME/.local/bin/herdr-transcript-view"
