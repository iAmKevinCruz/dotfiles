# Framework 16 internal kb only; Voyager untouched (its id is not listed)
[ids]
32ac:0012

[main]
rightalt     = layer(nav)
rightcontrol = layer(meh)

# active while right alt held
[nav]
h = left
j = down
k = up
l = right
comma = home
dot = end

# meh = Ctrl+Shift+Alt; held while right ctrl held
[meh:C-S-A]
