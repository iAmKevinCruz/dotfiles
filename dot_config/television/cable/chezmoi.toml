[metadata]
name = "chezmoi"
description = "Browse chezmoi-managed directories and open in nvim"
requirements = ["chezmoi"]

[source]
command = ["chezmoi managed -i dirs"]
output = "{}"

[preview]
command = "ls -1 --color=always \"$HOME/{0}\""

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open directory in nvim"
command = "nvim \"$HOME/{0}\""
mode = "execute"
