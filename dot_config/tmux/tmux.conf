# === Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# === Basics ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:extkeys"
set -as terminal-features ",xterm-ghostty:extkeys"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g repeat-time 1000            # 1s repeat window (default 500ms) for -r bindings
set -g extended-keys on            # pass through Shift+Enter, etc.
setw -g mode-keys vi
set -g set-clipboard on
set -g word-separators ' '
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',xterm-ghostty:clipboard'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# === No-prefix keybinds ===
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-N switch-client -n   # alt+shift+n next session
bind -n M-P switch-client -p   # alt+shift+p prev session
bind -n M-z resize-pane -Z     # alt+z to zoom pane
bind -n M-Left select-pane -LZ
bind -n M-Right select-pane -RZ
bind -n M-Up select-pane -UZ
bind -n M-Down select-pane -DZ

# === Window reordering ===
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# === Pane resizing ===
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5

# === Quality of life ===
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# === Restore default w (choose-tree) ===
unbind w
bind w choose-tree -Zw

# === Sessions ordered by name (choose-tree) ===
unbind s
bind s choose-tree -sZ -O name
bind S choose-tree -sZ -O name "switch-client -t '%%' \; command-prompt -I '%%' -p 'Rename session:' 'rename-session %%%%'"

# === Sesh ===
bind t display-popup -E -w 80% -h 80% "tv sesh"
bind T display-popup -E -w 60% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --no-preview | cut -d' ' -f1 | xargs -I{} tmux switch-client -t {}"
bind -n M-w display-popup -E -w 80% -h 80% "tv sesh"
bind -n M-W display-popup -E -w 60% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --no-preview | cut -d' ' -f1 | xargs -I{} tmux switch-client -t {}"

# === Hide/unhide pane (stack per window) ===
bind h run-shell "~/.config/tmux/pane-hide.sh"
bind H run-shell "~/.config/tmux/pane-unhide.sh"

# === Cheatsheet ===
unbind ?
bind ? display-popup -w 60% -h 80% "~/.config/tmux/cheatsheet.sh"

# === Scrollback to nvim ===
# prefix + e: open scrollback in nvim, jump to bottom (most recent)
bind e run-shell "~/.config/tmux/scrollback-to-nvim.sh"
# E in copy-mode: open scrollback in nvim at cursor line
bind -T copy-mode-vi E run-shell "~/.config/tmux/scrollback-to-nvim.sh cursor"

# === Status bar (dotbar) ===
set -g status-position top
set -g @tmux-dotbar-position top
set -g @tmux-dotbar-right false
# Hide session name + indicators on narrow terminals (mobile)
set -g @tmux-dotbar-status-left "#{?#{e|<:#{client_width},80},,#[bg=#0B0E14,fg=#565B66]#{?client_prefix,, #S }#[bg=#95E6CB,fg=#0B0E14,bold]#{?client_prefix, #S ,}#[bg=#0B0E14,fg=#475266,nobold] | #(~/.config/tmux/session-indicators.sh '#{session_name}') }"
set -g status-left-length 60

# === Session persistence ===
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# === TPM (keep at bottom) ===
run '~/.tmux/plugins/tpm/tpm'
