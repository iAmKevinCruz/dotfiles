# === Plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# === Basics ===
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# === No-prefix keybinds ===
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-z resize-pane -Z    # alt+z to zoom pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# === Quality of life ===
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# === Restore default w (choose-tree) ===
unbind w
bind w choose-tree -Zw

# === Sesh ===
bind t display-popup -E -w 40% -h 50% "sesh connect \"$(sesh list -t | fzf --no-preview)\""
bind T display-popup -E -w 60% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --no-preview | cut -d' ' -f1 | xargs -I{} tmux switch-client -t {}"
bind -n M-w display-popup -E -w 40% -h 50% "sesh connect \"$(sesh list -t | fzf --no-preview)\""
bind -n M-W display-popup -E -w 60% -h 60% "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf --no-preview | cut -d' ' -f1 | xargs -I{} tmux switch-client -t {}"

# === Cheatsheet ===
unbind ?
bind ? display-popup -w 60% -h 80% "~/.config/tmux/cheatsheet.sh"

# === Status bar (dotbar) ===
set -g status-position top
set -g @tmux-dotbar-position top

# === TPM (keep at bottom) ===
run '~/.tmux/plugins/tpm/tpm'
